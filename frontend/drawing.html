<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&family=Comic+Relief:wght@400;700&family=Delius+Swash+Caps&family=Lugrasimo&display=swap" rel="stylesheet">
        <link href="style.css" rel="stylesheet">
        <title>Drawing</title>
    </head>
    <body>
        <nav>
            <a href="index.html">Joining</a>
            <a href="drawing.html" class="active">Drawing</a>
            <a href="gallery.html">Gallery</a>
        </nav>

        <div class="container1">

            <div class="rows">

                <div class="row1">
                    <div class="menu1">
                        <button class="menu" onclick="toggleMenu()">
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>

                        <div id="menu">
                            <a href="#">New</a>
                            <a href="#">Save</a>
                            <a href="#">Export</a>
                            <a href="gallery.html">Gallery</a>
                        </div>
                    </div>

                    <div class="arrows">
                        <button class="menu">
                            <img src="media/arrow_left.png" alt="arrow on left">
                        </button>
                        <button class="menu">
                            <img src="media/arrow_right.png" alt="arrow on right">
                        </button>
                    </div>
                </div>

                <div class="row2">
                    <div class="tools">
                        <button class="menu" onclick="toggleMenu2()">
                            <img src="media/pencils.png" alt="pencils case">
                        </button>
                        <div id="menu2">
                            <button class="tool">
                                <img src="media/pencil.png" alt="pencil">
                                Pencil
                            </button>
                            <button class="tool">
                                <img src="media/pen.png" alt="pen">
                                Pen
                            </button>
                            <button class="tool">
                                <img src="media/soft_brush.png" alt="soft brush">
                                Soft brush
                            </button>
                            <button class="tool">
                                <img src="media/hard_brush.png" alt="hard brush">
                                Hard brush
                            </button>
                            <button class="tool">
                                <img src="media/airbrush.png" alt="air brush">
                                Air brush
                            </button>
                        </div>
                    </div>

                    <button class="menu tools">
                        <img src="media/eraser.png" alt="eraser">
                    </button>
                    
                    <div class="tools">
                        <button class="menu" onclick="toggleMenu3()">
                            <img src="media/rest_tools.png" alt="magic wand">
                        </button>
                        <div id="menu3">
                            <button class="tool small">
                                <img src="media/simetrically.png" alt="simetrals">
                                Simetrically
                            </button>
                            <button class="tool small">
                                <img src="media/paint_bucket.png" alt="paint bucket">
                                Paint bucket
                            </button>
                            <button class="tool small">
                                <img src="media/select.png" alt="selection">
                                Selection
                            </button>
                        </div>
                    </div>

                    <div class="tools">
                        <button class="menu" onclick="toggleMenu4()">
                            <img src="media/layers.png" alt="layers">
                        </button>
                        <div id="menu4">
                            <button class="tool">
                                Add layer
                            </button>
                            <button class="tool">
                                Layer 1
                            </button>
                            <button class="tool">
                                Background
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="colors">
                <img src="media/colors.png" alt="palette colors">
            </div>
        </div>

        <div class="board"></div>

        <footer></footer>

        <script src="script.js"></script>
    </body>
</html>
